name: Build ESP32-S2 UART to WUP-028

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use UART-WUP028 sources
        shell: bash
        run: |
          set -euo pipefail
          test -f src/usb_descriptors.c
          test -f src/report_ids.h
          test -f diagnostics/s2_uart_wup028/pad_packet.h
          test -f diagnostics/s2_uart_wup028/pad_gc.h
          cp diagnostics/s2_uart_wup028/main.c ports/esp32/main/main.c
          cp diagnostics/s2_uart_wup028/bridge.c ports/esp32/main/bridge.c
          cp diagnostics/s2_uart_wup028/pad_gc.h ports/esp32/main/pad_gc.h
          cp diagnostics/s2_uart_wup028/pad_packet.h ports/esp32/main/pad_packet.h
          cat > ports/esp32/main/idf_component.yml <<'MANIFEST'
          dependencies:
            espressif/esp_tinyusb: "^2.0.0"
          MANIFEST
          cat > ports/esp32/main/CMakeLists.txt <<'CMAKE'
          set(GCCA_CORE "${CMAKE_CURRENT_LIST_DIR}/../../../src")
          idf_component_register(
            SRCS "main.c" "bridge.c" "${GCCA_CORE}/usb_descriptors.c"
            INCLUDE_DIRS "." "${GCCA_CORE}"
            REQUIRES esp_tinyusb driver
            PRIV_REQUIRES esp_timer
          )
          CMAKE
      - name: Build firmware
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.2
          target: esp32s2
          path: ports/esp32
      - name: Upload flash images
        uses: actions/upload-artifact@v4
        with:
          name: WUP028-S2-UART-Bridge
          path: |
            ports/esp32/build/*.bin
            ports/esp32/build/bootloader/*.bin
            ports/esp32/build/partition_table/*.bin
            ports/esp32/build/flasher_args.json
          if-no-files-found: error
