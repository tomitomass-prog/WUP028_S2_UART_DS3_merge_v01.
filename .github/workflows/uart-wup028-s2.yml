name: Build ESP32-S2 UART to WUP-028

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout UART bridge sources
        uses: actions/checkout@v4

      - name: Check project files
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            diagnostics/s2_uart_wup028/main.c \
            diagnostics/s2_uart_wup028/bridge.c \
            diagnostics/s2_uart_wup028/pad_packet.h \
            diagnostics/s2_uart_wup028/pad_gc.h; do
            if [[ ! -f "$file" ]]; then
              echo "::error::Missing project file: $file"
              exit 1
            fi
          done
          echo "UART bridge sources found."

      - name: Fetch original WUP-028 USB project
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/loopj/usb-gamecube-controller-adapter.git _gcca_base
          for file in \
            _gcca_base/src/usb_descriptors.c \
            _gcca_base/src/report_ids.h \
            _gcca_base/ports/esp32/CMakeLists.txt; do
            if [[ ! -f "$file" ]]; then
              echo "::error::Missing upstream file: $file"
              exit 1
            fi
          done

      - name: Apply UART bridge to WUP-028
        shell: bash
        run: |
          set -euo pipefail
          cp diagnostics/s2_uart_wup028/main.c _gcca_base/ports/esp32/main/main.c
          cp diagnostics/s2_uart_wup028/bridge.c _gcca_base/ports/esp32/main/bridge.c
          cp diagnostics/s2_uart_wup028/pad_packet.h _gcca_base/ports/esp32/main/pad_packet.h
          cp diagnostics/s2_uart_wup028/pad_gc.h _gcca_base/ports/esp32/main/pad_gc.h
          cat > _gcca_base/ports/esp32/main/idf_component.yml <<'MANIFEST'
          dependencies:
            espressif/esp_tinyusb: "^2.0.0"
          MANIFEST
          cat > _gcca_base/ports/esp32/main/CMakeLists.txt <<'CMAKE'
          set(GCCA_CORE "${CMAKE_CURRENT_LIST_DIR}/../../../src")
          idf_component_register(
            SRCS "main.c" "bridge.c" "${GCCA_CORE}/usb_descriptors.c"
            INCLUDE_DIRS "." "${GCCA_CORE}"
            REQUIRES esp_tinyusb driver
            PRIV_REQUIRES esp_timer
          )
          CMAKE
          echo "WUP-028 USB sources and UART bridge assembled."

      - name: Build ESP32-S2 firmware
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.2
          target: esp32s2
          path: _gcca_base/ports/esp32

      - name: Upload flash images
        uses: actions/upload-artifact@v4
        with:
          name: WUP028-S2-UART-Bridge
          path: |
            _gcca_base/ports/esp32/build/*.bin
            _gcca_base/ports/esp32/build/bootloader/*.bin
            _gcca_base/ports/esp32/build/partition_table/*.bin
            _gcca_base/ports/esp32/build/flasher_args.json
          if-no-files-found: error
